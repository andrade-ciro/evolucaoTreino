// ---------------------------------------------------------------- modais
function modalHtml() {
  const m = S.ui.modal;
  if (!m) return '';
  let c = '';
  const s = S.sessao;
  if (m.t === 'menu' && s) {
    c = `<h3>Treino</h3>
      <button class="big w100" data-a="ir" data-h="#/">Ir para o início (o treino continua)</button>
      <button class="big w100 mt" data-a="encerrar">Encerrar treino</button>
      <button class="danger big w100 mt" data-a="descartar">Descartar treino</button>
      <button class="ghost big w100 mt" data-a="fecharModal">Fechar</button>`;
  } else if (m.t === 'exs' && s) {
    c = `<h3>Exercícios da sessão</h3>` + s.exercicios.map((e, i) => {
      const w = trabalhoDoEx(e).length;
      const st = e.pulado ? '<span class="tag">pulado</span>' : w >= e.series ? '<span class="tag ok">✓</span>' : e.key === s.atualKey ? '<span class="tag ac">atual</span>' : '';
      return `<div class="li"><button class="ghost grow" style="text-align:left;padding:0" data-a="selEx" data-k="${e.key}">
        <b>${esc(e.nome)}</b> ${e.extra ? '<span class="tag warn">extra</span>' : ''}<div class="muted small">${w}/${e.series} séries ${st}</div></button>
        <button data-a="moverEx" data-k="${e.key}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button data-a="moverEx" data-k="${e.key}" data-d="1" ${i === s.exercicios.length - 1 ? 'disabled' : ''} aria-label="Descer">↓</button>
        <button data-a="pularEx" data-k="${e.key}">${e.pulado ? 'Retomar' : 'Pular'}</button>
        <button data-a="modal" data-t="exEdit" data-k="${e.key}" aria-label="Editar ${esc(e.nome)}">✎</button></div>`;
    }).join('') + `<button class="pri big w100 mt" data-a="modal" data-t="picker" data-dest="sessao">+ Adicionar exercício</button>
      <button class="ghost big w100 mt" data-a="fecharModal">Fechar</button>`;
  } else if (m.t === 'picker') {
    c = `<h3>${m.dest === 'trocar' ? 'Trocar por' : 'Adicionar exercício'}</h3><input id="busca" placeholder="Buscar" autocomplete="off">
      <div class="mt">${exAtivos().map(e => `<button class="li" data-a="pickEx" data-id="${esc(e.exercicio_id)}" data-busca="${esc((e.nome + ' ' + e.grupo_muscular).toLowerCase())}">
        <span class="grow"><b>${esc(e.nome)}</b><div class="muted small">${esc(e.grupo_muscular)} · ${esc(EQUIP[e.equipamento] || '')}</div></span></button>`).join('') || '<p class="muted">Catálogo vazio.</p>'}</div>
      <button class="ghost big w100 mt" data-a="${m.dest === 'trocar' ? 'voltarModal' : 'fecharModal'}">${m.dest === 'trocar' ? 'Voltar' : 'Fechar'}</button>`;
  } else if (m.t === 'exEdit' && s) {
    const ex = m.novo ? null : s.exercicios.find(e => e.key === m.k);
    if (!m.novo && !ex) { S.ui.modal = null; return ''; }
    if (!m.draft) m.draft = { exercicio_id: ex.exercicio_id, series: ex.series, reps_min: ex.reps_min, reps_max: ex.reps_max, descanso_s: ex.descanso_s, plano: prefAplicarPlano() };
    const d = m.draft, nS = ex ? seriesDoEx(ex).length : 0;
    const campo = (rot, k) => `<label>${rot}<input data-ed="${k}" inputmode="numeric" value="${esc(d[k])}"></label>`;
    c = `<h3>${m.novo ? 'Adicionar exercício' : 'Editar exercício'}</h3>
      <button class="li" data-a="trocarEx" ${nS ? 'disabled' : ''}><span class="grow"><b>${esc(nomeEx(d.exercicio_id))}</b></span><span class="muted small">${nS ? '' : 'trocar ›'}</span></button>
      ${nS ? `<div class="muted small">Já tem ${nS} série${nS > 1 ? 's' : ''} registrada${nS > 1 ? 's' : ''}; para trocar o exercício, adicione outro ou exclua este.</div>` : ''}
      <div class="grid4 mt">${campo('Séries', 'series')}${campo('Reps mín', 'reps_min')}${campo('Reps máx', 'reps_max')}${campo('Descanso s', 'descanso_s')}</div>
      ${s.plano_id ? `<label class="row mt"><input type="checkbox" id="ed-plano" style="width:24px;min-height:24px;flex:none" ${d.plano ? 'checked' : ''}>
        <span>Aplicar também ao plano “${esc(s.plano_nome)}”</span></label>
        <div class="muted small">${d.plano ? 'O plano muda para os próximos treinos.' : 'Vale só para este treino.'}</div>` : ''}
      <div class="row mt">${m.novo ? '' : `<button class="danger grow" data-a="excluirExSessao" data-k="${ex.key}">Excluir</button>`}
        <button class="okb grow" data-a="salvarExEdit">${m.novo ? 'Adicionar' : 'Salvar'}</button></div>
      <button class="ghost big w100 mt" data-a="fecharModal">Cancelar</button>`;
  } else if (m.t === 'serie' && s) {
    const x = s.series.find(y => y.serie_id === m.id);
    if (!x) { S.ui.modal = null; return ''; }
    c = `<h3>Editar série</h3><div class="muted small">${esc(x.ex_key && (s.exercicios.find(e => e.key === x.ex_key) || {}).nome || nomeEx(x.exercicio_id))}</div>
      ${camposSerie(x)}
      ${x.descanso_real_s != null ? `<p class="muted small">Descanso depois desta série: ${fmtDur(x.descanso_real_s)}</p>` : ''}
      <div class="row mt"><button class="danger grow" data-a="excluirSerie" data-id="${x.serie_id}">Excluir</button><button class="okb grow" data-a="salvarSerie" data-id="${x.serie_id}">Salvar</button></div>
      <button class="ghost big w100 mt" data-a="fecharModal">Cancelar</button>`;
  } else if (m.t === 'novaSerie' && s) {
    const ex = s.exercicios.find(e => e.key === m.k);
    if (!ex) { S.ui.modal = null; return ''; }
    const w = trabalhoDoEx(ex), ult = w[w.length - 1];
    const v = { peso_kg: ult ? ult.peso_kg : ex.sugestao.peso, reps: ult ? ult.reps : ex.sugestao.reps[Math.min(w.length, ex.sugestao.reps.length - 1)], rir: null, aquecimento: false };
    c = `<h3>Nova série</h3><div class="muted small">${esc(ex.nome)}</div>
      ${camposSerie(v)}
      <div class="row mt"><button class="ghost grow" data-a="fecharModal">Cancelar</button><button class="okb grow" data-a="addSerie" data-k="${ex.key}">Adicionar</button></div>`;
  }
  return c ? `<div class="modal-bg" data-a="fecharModal" data-fundo="1"><div class="modal" role="dialog">${c}</div></div>` : '';
}

function camposSerie(x) {
  return `<div class="grid4 mt" style="grid-template-columns:1fr 1fr 1fr">
      <label>Peso (kg)<input id="m-peso" inputmode="decimal" value="${x.peso_kg == null ? '' : fmtKg(x.peso_kg)}"></label>
      <label>Reps<input id="m-reps" inputmode="numeric" value="${x.reps ?? ''}"></label>
      <label>RIR<select id="m-rir"><option value="">—</option>${[0, 1, 2, 3, 4].map(v => `<option ${x.rir === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>
    <label class="row mt"><input type="checkbox" id="m-aq" style="width:24px;min-height:24px" ${x.aquecimento ? 'checked' : ''}> Aquecimento</label>`;
}

/** Lê os campos do modal de série; null (com aviso) se inválidos. */
function lerCamposSerie() {
  const peso = num($('#m-peso').value), reps = Math.round(num($('#m-reps').value) || 0);
  if (peso == null || peso < 0 || reps < 1) { toast('Peso e repetições inválidos'); return null; }
  return { peso, reps, rir: $('#m-rir').value === '' ? null : Number($('#m-rir').value), aquecimento: $('#m-aq').checked };
}

// ---------------------------------------------------------------- ações
function abrirModal(m) { S.ui.modal = m; render(); }
function fecharModal() { S.ui.modal = null; render(); }

const acoes = {
  ir: el => { S.ui.modal = null; if (location.hash === el.dataset.h) render(); else location.hash = el.dataset.h; },
  voltar: () => history.length > 1 ? history.back() : (location.hash = '#/'),
  modal: el => abrirModal({ t: el.dataset.t, id: el.dataset.id, dest: el.dataset.dest, k: el.dataset.k }),
  fecharModal: () => fecharModal(),
  iniciar: el => iniciarSessao(el.dataset.id),
  registrar: () => registrarSerie(),

  step: el => {
    const ex = exAtual(), r = garantirRascunho(ex), d = Number(el.dataset.d);
    if (el.dataset.c === 'peso') {
      const inc = ex.incremento || 1;
      const base = r.peso ?? ex.sugestao.peso ?? 0;
      r.peso = Math.max(0, arred(base + d * inc));
      $('#in-peso').value = fmtKg(r.peso);
    } else {
      r.reps = Math.max(1, (num(r.reps) || 0) + d);
      $('#in-reps').value = r.reps;
    }
    salvar.sessao();
  },
  rir: el => { const r = garantirRascunho(exAtual()); r.rir = el.dataset.v === '' ? null : Number(el.dataset.v); salvar.sessao(); render(); },
  aquec: () => { const r = garantirRascunho(exAtual()); r.aquecimento = !r.aquecimento; salvar.sessao(); render(); },
  proxima: () => { fotografar('Iniciar próxima série'); pararDescanso(); salvar.sessao(); render(); },
  desfazer: () => desfazer(),
  pausar: () => {
    const s = S.sessao;
    if (!s || s.pausadoEm || s.estado !== 'ativa') return;
    s.pausadoEm = Date.now();
    S.ui.modal = null;
    salvar.sessao(); wake.desligar(); render();
  },
  retomar: () => { retomarPausa(); salvar.sessao(); wake.ligar(); audio.liberar(); render(); },
  ajuste: el => {
    const d = S.sessao.descanso;
    if (!d) return;
    d.ajuste = Math.max(-d.dur, d.ajuste + Number(el.dataset.d));
    const resta = d.inicio + (d.dur + d.ajuste) * 1000 - Date.now();
    if (resta > cfgVal('aviso_antecipado_s') * 1000) d.avisado = false;
    if (resta > 0) d.alertado = false;
    salvar.sessao();
    render();
  },

  selEx: el => { const s = S.sessao; if (s.atualKey === el.dataset.k) { fecharModal(); return; } fotografar('Trocar de exercício'); s.atualKey = el.dataset.k; s.rascunho = null; salvar.sessao(); fecharModal(); },
  moverEx: el => {
    const arr = S.sessao.exercicios, i = arr.findIndex(e => e.key === el.dataset.k), j = i + Number(el.dataset.d);
    if (j < 0 || j >= arr.length) return;
    fotografar('Mover ' + arr[i].nome);
    [arr[i], arr[j]] = [arr[j], arr[i]];
    salvar.sessao(); render();
  },
  pularEx: el => {
    const s = S.sessao, ex = s.exercicios.find(e => e.key === el.dataset.k);
    fotografar((ex.pulado ? 'Retomar ' : 'Pular ') + ex.nome);
    ex.pulado = !ex.pulado;
    if (ex.pulado && ex.key === s.atualKey) { const p = proximoPendente(s, ex.key); if (p) { s.atualKey = p.key; s.rascunho = null; } }
    salvar.sessao();
    if (ex.pulado && deveAutoFinalizar(s)) { S.ui.modal = null; pararDescanso(false); finalizar('auto'); return; }
    render();
  },
  pickEx: el => {
    const id = el.dataset.id, m = S.ui.modal;
    if (m.dest === 'sessao') {
      S.ui.modal = { t: 'exEdit', novo: true, draft: { exercicio_id: id, ...itemPadrao(), plano: prefAplicarPlano() } };
      render();
      return;
    } else if (m.dest === 'trocar') {
      m.voltar.draft.exercicio_id = id;
      S.ui.modal = m.voltar;
      render();
      return;
    } else if (m.dest === 'plano' && S.ui.planoDraft) {
      const p = itemPadrao();
      S.ui.planoDraft.itens.push({ item_id: uuid(), plano_id: S.ui.planoDraft.plano.plano_id, exercicio_id: id, ...p, obs: '' });
    }
    fecharModal();
  },
  trocarEx: () => { S.ui.modal = { t: 'picker', dest: 'trocar', voltar: S.ui.modal }; render(); },
  voltarModal: () => { S.ui.modal = S.ui.modal.voltar || null; render(); },
  salvarExEdit: () => {
    const s = S.sessao, m = S.ui.modal, d = m.draft, v = rascunhoExValido(d);
    if (!v) return;
    const noPlano = !!(s.plano_id && d.plano);
    if (m.novo) {
      const nx = novoExSessao(d.exercicio_id, v, !noPlano);
      fotografar('Adicionar ' + nx.nome, noPlano);
      s.exercicios.splice(s.exercicios.findIndex(e => e.key === s.atualKey) + 1, 0, nx);
      s.atualKey = nx.key;
      if (noPlano) inserirNoPlano(s, nx);
    } else {
      const ex = s.exercicios.find(e => e.key === m.k), trocou = d.exercicio_id !== ex.exercicio_id;
      if (trocou && seriesDoEx(ex).length) { toast('Exercício já tem séries; não dá para trocar'); return; }
      fotografar((trocou ? 'Trocar ' : 'Alterar ') + ex.nome, noPlano);
      const nx = novoExSessao(d.exercicio_id, v, ex.extra);
      // Sem troca, mantém "última vez" e o recorde de antes do treino; só a sugestão muda com a nova faixa
      Object.assign(ex, pick(nx, trocou
        ? ['exercicio_id', 'nome', 'equipamento', 'incremento', 'series', 'reps_min', 'reps_max', 'descanso_s', 'sugestao', 'ultima', 'recordeAnterior']
        : ['series', 'reps_min', 'reps_max', 'descanso_s', 'sugestao']));
      if (noPlano) {
        const it = ex.item_id && S.cache.itens.find(i => i.item_id === ex.item_id && i.plano_id === s.plano_id);
        if (it) { gravarItemPlano({ ...it, ...pick(ex, ['exercicio_id', 'series', 'reps_min', 'reps_max', 'descanso_s']) }); salvar.cache(); }
        else { ex.extra = false; inserirNoPlano(s, ex); }
      }
    }
    recalcPlanejadas(s);
    s.rascunho = null;
    salvar.sessao();
    toast(noPlano ? 'Salvo no treino e no plano' : 'Salvo só neste treino');
    fecharModal();
  },
  excluirExSessao: el => {
    const s = S.sessao, ex = s.exercicios.find(e => e.key === el.dataset.k), ss = seriesDoEx(ex);
    if (ss.length && !confirm(`Excluir ${ex.nome} e ${ss.length > 1 ? 'suas ' + ss.length + ' séries' : 'a série registrada'}?`)) return;
    const noPlano = !!(s.plano_id && S.ui.modal.draft && S.ui.modal.draft.plano && ex.item_id);
    fotografar('Excluir ' + ex.nome, noPlano);
    ss.forEach(x => enfileirarOp('delete', 'Series', x.serie_id));
    s.series = s.series.filter(x => x.ex_key !== ex.key);
    if (s.descanso && ss.some(x => x.serie_id === s.descanso.serie_id)) s.descanso = null;
    if (s.atualKey === ex.key) { const p = proximoPendente(s, ex.key); s.atualKey = p ? p.key : null; }
    s.exercicios = s.exercicios.filter(e => e.key !== ex.key);
    if (!s.atualKey && s.exercicios[0]) s.atualKey = s.exercicios[0].key;
    if (noPlano) {
      S.cache.itens = S.cache.itens.filter(i => i.item_id !== ex.item_id);
      enfileirarOp('delete', 'PlanoItens', ex.item_id);
      salvar.cache();
    }
    recalcPlanejadas(s);
    s.rascunho = null;
    salvar.sessao();
    S.ui.modal = null;
    toast(noPlano ? 'Excluído do treino e do plano' : 'Excluído deste treino');
    if (deveAutoFinalizar(s)) { pararDescanso(false); finalizar('auto'); return; }
    render();
  },
  salvarSerie: el => {
    const v = lerCamposSerie();
    if (!v) return;
    fotografar('Editar série');
    const x = S.sessao.series.find(y => y.serie_id === el.dataset.id);
    Object.assign(x, { peso_kg: v.peso, reps: v.reps, rir: v.rir, aquecimento: v.aquecimento });
    enfileirarOp('upsert', 'Series', x.serie_id, pick(x, ['peso_kg', 'reps', 'rir', 'aquecimento']));
    salvar.sessao(); fecharModal();
  },
  excluirSerie: el => {
    const s = S.sessao;
    fotografar('Excluir série');
    s.series = s.series.filter(y => y.serie_id !== el.dataset.id);
    if (s.descanso && s.descanso.serie_id === el.dataset.id) s.descanso = null;
    enfileirarOp('delete', 'Series', el.dataset.id);
    s.rascunho = null;
    salvar.sessao(); fecharModal();
    toast('Série excluída — ↶ desfaz');
  },
  addSerie: el => {
    const s = S.sessao, ex = s.exercicios.find(e => e.key === el.dataset.k), v = lerCamposSerie();
    if (!ex || !v) return;
    fotografar('Adicionar série — ' + ex.nome);
    criarSerie(ex, v);
    salvar.sessao(); fecharModal();
  },
  encerrar: () => {
    if (!confirm('Encerrar o treino agora?')) return;
    S.ui.modal = null;
    fotografar('Encerrar treino');
    pararDescanso(false);
    finalizar('manual');
  },
  descartar: () => {
    if (!confirm('Descartar este treino? As séries registradas serão apagadas da planilha.')) return;
    const s = S.sessao;
    s.series.forEach(x => enfileirarOp('delete', 'Series', x.serie_id));
    enfileirarOp('delete', 'Sessoes', s.sessao_id);
    S.sessao = null; S.ui.modal = null; salvar.sessao(); wake.desligar();
    location.hash = '#/'; render();
  },
  continuar: () => {
    const s = S.sessao;
    fotografar('Continuar treinando');
    s.pausaTotal = (s.pausaTotal || 0) + (Date.now() - s.fim); // o tempo no resumo não conta como treino
    s.estado = 'ativa'; s.fim = null; s.encerramento = null;
    salvar.sessao(); wake.ligar(); render();
  },
  concluir: () => concluirSessao(),

  // planos
  toggleArq: () => { S.ui.verArquivados = !S.ui.verArquivados; render(); },
  novoPlano: () => {
    const id = uuid();
    const ordem = Math.max(0, ...S.cache.planos.map(p => num(p.ordem) || 0)) + 1;
    S.ui.planoDraft = { plano: { plano_id: id, nome: '', ordem, ativo: true }, itens: [], originais: [], novo: true };
    location.hash = '#/plano/' + id;
  },
  planoMover: el => {
    const ativos = planosOrd().filter(p => bool(p.ativo, true));
    const i = ativos.findIndex(p => p.plano_id === el.dataset.id), j = i + Number(el.dataset.d);
    if (j < 0 || j >= ativos.length) return;
    [ativos[i], ativos[j]] = [ativos[j], ativos[i]];
    ativos.forEach((p, k) => {
      if (num(p.ordem) !== k + 1) { p.ordem = k + 1; enfileirarOp('upsert', 'Planos', p.plano_id, { ordem: k + 1 }); }
    });
    salvar.cache(); render();
  },
  planoDuplicar: el => {
    const p = S.cache.planos.find(x => x.plano_id === el.dataset.id);
    const novo = { plano_id: uuid(), nome: p.nome + ' (cópia)', ordem: Math.max(0, ...S.cache.planos.map(x => num(x.ordem) || 0)) + 1, ativo: true };
    S.cache.planos.push(novo);
    enfileirarOp('upsert', 'Planos', novo.plano_id, pick(novo, ['nome', 'ordem', 'ativo']));
    itensDoPlano(p.plano_id).forEach(it => {
      const c = { ...it, item_id: uuid(), plano_id: novo.plano_id };
      S.cache.itens.push(c);
      enfileirarOp('upsert', 'PlanoItens', c.item_id, pick(c, COLS.PlanoItens));
    });
    salvar.cache(); toast('Plano duplicado'); render();
  },
  planoArquivar: el => {
    const p = S.cache.planos.find(x => x.plano_id === el.dataset.id);
    p.ativo = !bool(p.ativo, true);
    enfileirarOp('upsert', 'Planos', p.plano_id, { ativo: p.ativo });
    salvar.cache(); render();
  },
  piMover: el => {
    const it = S.ui.planoDraft.itens, i = Number(el.dataset.i), j = i + Number(el.dataset.d);
    if (j < 0 || j >= it.length) return;
    [it[i], it[j]] = [it[j], it[i]];
    render();
  },
  piRemover: el => { S.ui.planoDraft.itens.splice(Number(el.dataset.i), 1); render(); },
  salvarPlano: () => {
    const d = S.ui.planoDraft;
    d.plano.nome = $('#f-plano-nome').value.trim();
    if (!d.plano.nome) { toast('Dê um nome ao plano'); return; }
    for (const it of d.itens) {
      it.series = Math.max(1, Math.round(num(it.series) || 1));
      it.reps_min = Math.max(1, Math.round(num(it.reps_min) || 1));
      it.reps_max = Math.max(it.reps_min, Math.round(num(it.reps_max) || it.reps_min));
      it.descanso_s = Math.max(0, Math.round(num(it.descanso_s) ?? cfgVal('descanso_padrao_s')));
    }
    upsertLocal('planos', 'plano_id', d.plano);
    enfileirarOp('upsert', 'Planos', d.plano.plano_id, pick(d.plano, ['nome', 'ordem', 'ativo']));
    const ids = new Set(d.itens.map(i => i.item_id));
    d.originais.filter(id => !ids.has(id)).forEach(id => enfileirarOp('delete', 'PlanoItens', id));
    S.cache.itens = S.cache.itens.filter(i => i.plano_id !== d.plano.plano_id);
    d.itens.forEach((it, k) => {
      it.ordem = k + 1;
      it.plano_id = d.plano.plano_id;
      S.cache.itens.push(it);
      enfileirarOp('upsert', 'PlanoItens', it.item_id, pick(it, COLS.PlanoItens));
    });
    salvar.cache();
    S.ui.planoDraft = null;
    toast('Plano salvo');
    location.hash = '#/planos';
  },

  // exercícios
  salvarExercicio: el => {
    const nome = $('#f-nome').value.trim();
    if (!nome) { toast('Informe o nome'); return; }
    const inc = num($('#f-inc').value);
    if (inc == null || inc < 0) { toast('Incremento inválido'); return; }
    const e = {
      exercicio_id: el.dataset.id || uuid(), nome, grupo_muscular: $('#f-grupo').value.trim(), equipamento: $('#f-equip').value,
      incremento_kg: inc, carga_inicial_kg: num($('#f-carga').value) ?? '', ativo: $('#f-ativo').checked,
    };
    upsertLocal('exercicios', 'exercicio_id', e);
    salvar.cache();
    enfileirarOp('upsert', 'Exercicios', e.exercicio_id, pick(e, ['nome', 'grupo_muscular', 'equipamento', 'incremento_kg', 'carga_inicial_kg', 'ativo']));
    toast('Exercício salvo');
    acoes.voltar();
  },

  // config
  salvarCfg: () => {
    S.cfg = { url: $('#c-url').value.trim(), token: $('#c-token').value.trim() };
    salvar.cfg(); S.sync.erro = null; S.sync.espera = 0;
    toast('Conexão salva');
    carregarDados(false).then(render);
  },
  testarConexao: async () => {
    const ant = S.cfg;
    S.cfg = { url: $('#c-url').value.trim(), token: $('#c-token').value.trim() };
    try { const r = await api('GET', null, { acao: 'ping' }); toast(`OK — planilha "${r.planilha}", v${r.versao}`); }
    catch (e) { toast('Falhou: ' + e.message); }
    finally { S.cfg = ant; }
  },
  syncAgora: async () => { S.sync.espera = 0; await sincronizar(); render(); toast(S.fila.length ? 'Ainda há pendentes' : 'Tudo enviado'); },
  recarregar: async () => { await carregarDados(false); render(); },
  testarAlerta: () => { audio.liberar(); alerta.aviso(); setTimeout(() => alerta.forte(), 900); },
  salvarConfigApp: () => {
    const campos = { descanso_padrao_s: '#c-descanso', aviso_antecipado_s: '#c-aviso', series_padrao: '#c-series', reps_min_padrao: '#c-rmin', reps_max_padrao: '#c-rmax' };
    Object.entries(campos).forEach(([k, sel]) => {
      const v = num($(sel).value);
      if (v == null || v < 0 || v === cfgVal(k)) return;
      S.cache.config[k] = v;
      enfileirarOp('upsert', 'Config', k, { valor: v });
    });
    salvar.cache(); toast('Configurações salvas'); render();
  },
};

// ---------------------------------------------------------------- eventos
document.addEventListener('click', ev => {
  if (S.sessao) audio.liberar(); // iOS só libera áudio dentro de um toque
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.dataset.fundo && ev.target !== el) return; // clique dentro do modal, fora de um botão
  const fn = acoes[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'in-peso' || t.id === 'in-reps') {
    const r = garantirRascunho(exAtual());
    if (t.id === 'in-peso') r.peso = num(t.value); else r.reps = num(t.value);
    salvar.sessao();
  } else if (t.dataset.pi != null && S.ui.planoDraft) {
    S.ui.planoDraft.itens[Number(t.dataset.pi)][t.dataset.campo] = t.value;
  } else if (t.dataset.ed && S.ui.modal && S.ui.modal.draft) {
    S.ui.modal.draft[t.dataset.ed] = t.value;
  } else if (t.id === 'res-obs' && S.sessao) {
    S.sessao.obs = t.value;
    salvar.sessao();
  } else if (t.id === 'f-plano-nome' && S.ui.planoDraft) {
    S.ui.planoDraft.plano.nome = t.value;
  } else if (t.id === 'busca') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('[data-busca]').forEach(x => { x.style.display = !q || x.dataset.busca.includes(q) ? '' : 'none'; });
    document.querySelectorAll('[data-grupo]').forEach(x => { x.style.display = q ? 'none' : ''; });
  }
});

document.addEventListener('change', ev => {
  if (ev.target.id === 'ed-plano' && S.ui.modal && S.ui.modal.draft) {
    S.ui.modal.draft.plano = ev.target.checked;
    LS.set('aplicarNoPlano', ev.target.checked);
    render();
    return;
  }
  if (ev.target.id === 'f-equip' && ev.target.dataset.novo) $('#f-inc').value = fmtKg(INC_PADRAO[ev.target.value]);
});

// Seleciona o conteúdo ao tocar no campo, para digitar direto
document.addEventListener('focusin', ev => { if (ev.target.matches('.stepper input')) setTimeout(() => ev.target.select(), 0); });

window.addEventListener('hashchange', () => { S.ui.modal = null; render(); window.scrollTo(0, 0); });
window.addEventListener('online', () => { S.sync.espera = 0; sincronizar(); });
window.addEventListener('offline', atualizarBadge);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.sessao && S.sessao.estado === 'ativa' && !S.sessao.pausadoEm) wake.ligar();
  tick();
  sincronizar();
});
// Outra aba alterou os dados (RP-13): recarrega o estado
window.addEventListener('storage', ev => {
  if (!ev.key || !ev.key.startsWith('treino.')) return;
  S.sessao = LS.get('sessao', null); S.fila = LS.get('fila', []); S.cache = Object.assign({}, CACHE_VAZIO, LS.get('cache', {}));
  render();
});

// ---------------------------------------------------------------- testes no navegador (?test)
function rodarTestes() {
  const res = [];
  const t = (nome, cond, info) => res.push({ nome, ok: !!cond, info });
  const ex = { incremento_kg: 2.5, carga_inicial_kg: 20 }, it = { series: 3, reps_min: 8, reps_max: 12 };
  const ses = (...a) => ({ series: a.map(([p, r, aq], i) => ({ peso_kg: p, reps: r, n_serie: i + 1, aquecimento: !!aq })) });
  let s;
  s = sugerir([], it, ex); t('1. sem histórico → carga inicial × mínimo', s.regra === 1 && s.peso === 20 && s.reps.join() === '8,8,8', s);
  s = sugerir([], it, { incremento_kg: 2.5, carga_inicial_kg: '' }); t('1. sem histórico e sem carga inicial → vazio', s.peso === null, s);
  s = sugerir([ses([40, 12], [40, 12], [40, 12])], it, ex); t('2. exemplo do documento: 40×12,12,12 → 42,5×8', s.regra === 2 && s.peso === 42.5 && s.reps.join() === '8,8,8', s);
  s = sugerir([ses([40, 12], [40, 11], [40, 10])], it, ex); t('4. exemplo do documento: 40×12,11,10 → 40×12,12,11', s.regra === 4 && s.peso === 40 && s.reps.join() === '12,12,11', s);
  s = sugerir([ses([20, 12, 1], [40, 12], [40, 12], [40, 12])], it, ex); t('aquecimento é ignorado', s.regra === 2 && s.peso === 42.5, s);
  s = sugerir([ses([40, 12], [40, 12])], it, ex); t('menos séries que o plano não conta como "todas no máximo"', s.regra === 4 && s.reps.join() === '12,12,12', s);
  s = sugerir([ses([40, 7], [40, 8], [40, 8]), ses([40, 8], [40, 6], [40, 8])], it, ex); t('3. abaixo do mínimo 2 sessões → −1 incremento', s.regra === 3 && s.peso === 37.5 && s.reps.join() === '8,8,8', s);
  s = sugerir([ses([40, 7], [40, 8], [40, 8]), ses([40, 9], [40, 9], [40, 8])], it, ex); t('abaixo só na última → regra 4', s.regra === 4 && s.reps.join() === '8,9,9', s);
  s = sugerir([ses([40, 12], [40, 12], [40, 12]), ses([40, 5], [40, 5], [40, 5])], it, ex); t('regra 2 tem prioridade sobre a 3', s.regra === 2, s);
  s = sugerir([ses([0, 5], [0, 5], [0, 5]), ses([0, 4], [0, 4], [0, 4])], it, ex); t('regra 3 nunca deixa carga negativa', s.peso === 0, s);
  s = sugerir([ses([40, 10], [40, 10], [37.5, 12])], it, ex); t('carga base = a mais frequente', s.peso === 40, s);
  s = sugerir([ses([0, 12], [0, 12], [0, 12])], it, { incremento_kg: 0 }); t('sem incremento: mantém carga e reps no máximo', s.peso === 0 && s.reps.join() === '12,12,12', s);
  s = sugerir([ses(['40', '12'], ['40', '12'], ['40', '12'])], { series: '3', reps_min: '8', reps_max: '12' }, { incremento_kg: '2,5' }); t('aceita números vindos como texto', s.peso === 42.5, s);
  t('Epley 100×10 ≈ 133,3', Math.abs(e1rm(100, 10) - 133.333) < 0.01);
  t('iso() tem fuso', /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d[+-]\d\d:\d\d$/.test(iso(Date.now())), iso(Date.now()));
  t('fmtDur', fmtDur(65) === '1:05' && fmtDur(3725) === '1:02:05');
  t('volume halter conta os dois', volumeSerie({ peso_kg: 10, reps: 10 }, 'halter') === 200 && volumeSerie({ peso_kg: 10, reps: 10, aquecimento: true }, 'barra') === 0);
  let f = [];
  enfileirar(f, { qid: 'a', op: 'upsert', aba: 'Series', id: '1', dados: { peso_kg: 40 } });
  enfileirar(f, { qid: 'b', op: 'upsert', aba: 'Series', id: '1', dados: { reps: 10 } });
  t('fila junta upserts do mesmo id', f.length === 1 && f[0].dados.peso_kg === 40 && f[0].dados.reps === 10, f);
  enfileirar(f, { qid: 'c', op: 'delete', aba: 'Series', id: '1' });
  t('delete descarta upsert pendente', f.length === 1 && f[0].op === 'delete', f);
  f = [{ qid: 'a', op: 'upsert', aba: 'Series', id: '1', dados: { peso_kg: 40 } }];
  enfileirar(f, { qid: 'b', op: 'upsert', aba: 'Series', id: '1', dados: { reps: 10 } }, new Set(['a']));
  t('não mexe em operação em envio', f.length === 2 && f[0].dados.reps === undefined, f);
  const rec = atualizarRecorde(null, [{ peso_kg: 100, reps: 5 }, { peso_kg: 90, reps: 10 }, { peso_kg: 120, reps: 1, aquecimento: true }], 'x');
  t('recordes ignoram aquecimento', rec.peso.valor === 100 && Math.round(rec.e1rm.valor) === 120, rec);
  t('tempo ativo desconta pausas', tempoAtivo({ inicio: 0, pausaTotal: 60000 }, 600000) === 540000);
  t('tempo ativo congela durante a pausa', tempoAtivo({ inicio: 0, pausaTotal: 0, pausadoEm: 300000 }, 900000) === 300000);
  t('tempo ativo para no fim', tempoAtivo({ inicio: 0, fim: 100000, pausaTotal: 10000 }, 900000) === 90000);
  const sA = { serie_id: 'a', peso_kg: 40, reps: 10, descanso_real_s: null }, sB = { serie_id: 'b', peso_kg: 40, reps: 9, descanso_real_s: null };
  let ops = opsParaReverter([sA, sB], [sA], ['peso_kg', 'reps', 'descanso_real_s']);
  t('desfazer registro apaga a série nova', ops.length === 1 && ops[0].op === 'delete' && ops[0].id === 'b', ops);
  ops = opsParaReverter([{ ...sA, descanso_real_s: 95 }], [sA], ['peso_kg', 'reps', 'descanso_real_s']);
  t('desfazer "próxima série" limpa o descanso gravado', ops.length === 1 && ops[0].op === 'upsert' && ops[0].dados.descanso_real_s === null, ops);
  ops = opsParaReverter([], [sA], ['peso_kg', 'reps']);
  t('desfazer exclusão recria a série', ops.length === 1 && ops[0].op === 'upsert' && ops[0].dados.reps === 10, ops);
  t('nada mudou → nenhuma operação', opsParaReverter([sA], [sA], ['peso_kg', 'reps']).length === 0);
  const iA = { item_id: 'i1', series: 3 }, iB = { item_id: 'i2', series: 4 };
  ops = opsParaReverter([{ ...iA, series: 5 }, iB], [iA], ['series'], 'item_id');
  t('desfazer no plano: reverte item alterado e apaga o inserido', ops.length === 2 && ops.some(o => o.op === 'delete' && o.id === 'i2') && ops.some(o => o.op === 'upsert' && o.id === 'i1' && o.dados.series === 3), ops);

  const ok = res.filter(r => r.ok).length;
  $('#app').innerHTML = `<div class="top"><h1>Testes</h1><a href="./" class="badge">voltar</a></div>
    <div class="card"><b>${ok}/${res.length} passaram</b><ul class="testes">${res.map(r => `<li class="${r.ok ? 'p' : 'f'}">${r.ok ? '✓' : '✗'} ${esc(r.nome)}${r.ok ? '' : `<pre class="small">${esc(JSON.stringify(r.info))}</pre>`}</li>`).join('')}</ul></div>`;
  return res;
}

// ---------------------------------------------------------------- partida
if (new URLSearchParams(location.search).has('test')) {
  rodarTestes();
} else {
  if (S.sessao && rota().r !== 'sessao') location.hash = '#/sessao';
  render();
  if (S.sessao && S.sessao.estado === 'ativa' && !S.sessao.pausadoEm) wake.ligar();
  setInterval(tick, 250);
  setInterval(() => { if (S.fila.length && !S.sync.ocupado) sincronizar(); }, 30000);
  sincronizar().then(() => carregarDados(true));
}
</script>
