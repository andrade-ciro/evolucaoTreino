<style>
:root{--bg:#0f1115;--bg2:#181b22;--bg3:#232733;--bd:#2e3340;--tx:#e8eaf0;--tx2:#9aa1b2;--ac:#4f8cff;--ok:#2fbf71;--warn:#f5a524;--err:#ef4444;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

<body>
<div id="app"></div>
<div id="flash"></div>
<div id="toast"></div>
<script>
'use strict';
const VERSAO = '1.2.0';

// <núcleo> — funções puras, sem DOM; testadas por ?test e por testes/rodar.js
const DEF = { descanso_padrao_s: 90, aviso_antecipado_s: 10, series_padrao: 3, reps_min_padrao: 8, reps_max_padrao: 12, historico_sessoes: 5 };
const EQUIP = { barra: 'Barra', halter: 'Halter', maquina: 'Máquina', cabo: 'Cabo', peso_corporal: 'Peso corporal' };
const INC_PADRAO = { barra: 2.5, halter: 2, maquina: 5, cabo: 2.5, peso_corporal: 2.5 };
const COLS = {
  Sessoes: ['sessao_id', 'plano_id', 'plano_nome', 'inicio', 'fim', 'duracao_s', 'pausa_s', 'encerramento', 'series_planejadas', 'series_feitas', 'volume_kg', 'obs'],
  Series: ['serie_id', 'sessao_id', 'exercicio_id', 'ordem_exercicio', 'n_serie', 'aquecimento', 'peso_kg', 'reps', 'rir',
    'sugerido_peso_kg', 'sugerido_reps', 'descanso_real_s', 'registrado_em'],
  PlanoItens: ['plano_id', 'ordem', 'exercicio_id', 'series', 'reps_min', 'reps_max', 'descanso_s', 'obs'],
};

function num(x) {
  if (x === '' || x == null) return null;
  const n = typeof x === 'number' ? x : parseFloat(String(x).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}
function bool(x, padrao = false) {
  if (x === '' || x == null) return padrao;
  return x === true || x === 1 || /^(true|sim|1|verdadeiro)$/i.test(String(x));
}
const arred = x => Math.round(x * 100) / 100;
const e1rm = (peso, reps) => peso * (1 + reps / 30); // Epley
const pad = n => String(n).padStart(2, '0');
const fmtKg = x => x == null ? '—' : Number(x).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
}
/** ISO 8601 com o fuso local, ex. 2026-10-20T07:30:00-03:00 */
function iso(ms) {
  const d = new Date(ms), off = -d.getTimezoneOffset(), a = Math.abs(off);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
    `${off >= 0 ? '+' : '-'}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}

/** Carga mais frequente entre as séries; empate fica com a maior. */
function pesoBase(series) {
  const cont = new Map();
  for (const s of series) cont.set(s.peso, (cont.get(s.peso) || 0) + 1);
  let melhor = null, n = -1;
  for (const [p, c] of cont) if (c > n || (c === n && p > melhor)) { melhor = p; n = c; }
  return melhor;
}

/**
 * Regra de sugestão (RP-23), dupla progressão.
 * historico: sessões anteriores do exercício, mais recente primeiro: [{ series: [{peso_kg, reps, aquecimento, n_serie}] }]
 * item: { series, reps_min, reps_max } · ex: { incremento_kg, carga_inicial_kg }
 * → { regra, peso, reps: [por série], motivo }
 */
function sugerir(historico, item, ex) {
  const n = Math.max(1, num(item.series) || 1);
  const min = num(item.reps_min) || 1, max = Math.max(min, num(item.reps_max) || min);
  const inc = num(ex && ex.incremento_kg) || 0;
  const repete = r => Array(n).fill(r);
  const trab = (historico || [])
    .map(s => (s.series || [])
      .filter(x => !bool(x.aquecimento) && (num(x.reps) || 0) > 0)
      .sort((a, b) => (num(a.n_serie) || 0) - (num(b.n_serie) || 0))
      .map(x => ({ peso: num(x.peso_kg) || 0, reps: num(x.reps) })))
    .filter(a => a.length);

  // 1. Sem histórico: calibração
  if (!trab.length) {
    const p = ex ? num(ex.carga_inicial_kg) : null;
    return { regra: 1, peso: p, reps: repete(min), motivo: 'Sem histórico: sessão de calibração' + (p == null ? ' (informe a carga)' : '') };
  }
  const ult = trab[0], base = pesoBase(ult);

  // 2. Todas as séries no máximo da faixa
  if (ult.length >= n && ult.every(s => s.reps >= max && s.peso >= base)) {
    if (inc > 0) return { regra: 2, peso: arred(base + inc), reps: repete(min), motivo: `Bateu ${max} repetições em todas as séries: +${fmtKg(inc)} kg` };
    return { regra: 2, peso: base, reps: repete(max), motivo: `Bateu ${max} repetições em todas as séries (exercício sem incremento definido)` };
  }

  // 3. Abaixo do mínimo em alguma série por 2 sessões seguidas
  const abaixo = a => a.some(s => s.reps < min);
  if (trab.length >= 2 && abaixo(trab[0]) && abaixo(trab[1])) {
    return { regra: 3, peso: Math.max(0, arred(base - inc)), reps: repete(min), motivo: `Abaixo de ${min} repetições em 2 sessões seguidas: −${fmtKg(inc)} kg` };
  }

  // 4. Demais casos: mesma carga, +1 repetição por série até o máximo
  const reps = [];
  for (let i = 0; i < n; i++) reps.push(Math.min(max, (ult[i] || ult[ult.length - 1]).reps + 1));
  return { regra: 4, peso: base, reps, motivo: `Mesma carga: +1 repetição por série, até ${max}` };
}

/** Insere uma operação na fila, juntando upserts pendentes do mesmo registro. Não toca operações em envio. */
function enfileirar(fila, op, emEnvio = new Set()) {
  const mesmo = x => x.aba === op.aba && x.id === op.id && !emEnvio.has(x.qid);
  if (op.op === 'upsert') {
    const i = fila.findIndex(x => x.op === 'upsert' && mesmo(x));
    // Só junta se não houver delete do mesmo id depois do upsert pendente
    if (i >= 0 && !fila.slice(i + 1).some(x => x.op === 'delete' && x.aba === op.aba && x.id === op.id)) {
      fila[i] = { ...fila[i], dados: { ...fila[i].dados, ...op.dados } };
      return fila;
    }
  } else if (op.op === 'delete') {
    for (let i = fila.length - 1; i >= 0; i--) if (fila[i].op === 'upsert' && mesmo(fila[i])) fila.splice(i, 1);
  }
  fila.push(op);
  return fila;
}

/** Volume em kg: halter conta os dois halteres; peso corporal conta só a carga adicional. */
function volumeSerie(s, equipamento) {
  if (bool(s.aquecimento)) return 0;
  return (num(s.peso_kg) || 0) * (num(s.reps) || 0) * (equipamento === 'halter' ? 2 : 1);
}

/** Atualiza recordes {e1rm, peso} com séries de trabalho. Devolve o novo objeto. */
function atualizarRecorde(rec, series, data) {
  rec = rec ? { ...rec } : {};
  for (const s of series) {
    if (bool(s.aquecimento)) continue;
    const p = num(s.peso_kg) || 0, r = num(s.reps) || 0;
    if (r <= 0) continue;
    const e = e1rm(p, r);
    if (p > 0 && (!rec.e1rm || e > rec.e1rm.valor)) rec.e1rm = { valor: e, peso: p, reps: r, data };
    if (!rec.peso || p > rec.peso.valor || (p === rec.peso.valor && r > rec.peso.reps)) rec.peso = { valor: p, reps: r, data };
  }
  return rec;
}

function pick(obj, cols) {
  const o = {};
  for (const c of cols) if (obj[c] !== undefined) o[c] = obj[c];
  return o;
}

/** Tempo de treino em ms, descontando as pausas. */
function tempoAtivo(s, agora) {
  return Math.max(0, (s.fim || s.pausadoEm || agora) - s.inicio - (s.pausaTotal || 0));
}

/** Operações que levam a planilha das séries `atuais` de volta às séries `alvo` (usado no desfazer). */
function opsParaReverter(atuais, alvo, cols, chave = 'serie_id') {
  const ops = [], porId = new Map(atuais.map(x => [x[chave], x])), ids = new Set(alvo.map(x => x[chave]));
  for (const x of atuais) if (!ids.has(x[chave])) ops.push({ op: 'delete', id: x[chave] });
  for (const x of alvo) {
    const a = porId.get(x[chave]), d = pick(x, cols);
    if (!a || JSON.stringify(pick(a, cols)) !== JSON.stringify(d)) ops.push({ op: 'upsert', id: x[chave], dados: d });
  }
  return ops;
}
// </núcleo>

// ---------------------------------------------------------------- utilidades de DOM
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function uuid() {
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { /* contexto inseguro */ } }
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function fmtData(s) {
  const d = new Date(s);
  if (isNaN(d)) return '';
  return d.getFullYear() === new Date().getFullYear() ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 2800);
}
// ---------------------------------------------------------------- armazenamento local (RT-06)
const LS = {
  get(k, d) { try { const v = localStorage.getItem('treino.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('treino.' + k, JSON.stringify(v)); } catch (e) { toast('Erro ao gravar no aparelho: ' + e.message); } },
};
const CACHE_VAZIO = { exercicios: [], planos: [], itens: [], config: {}, historico: {}, recordes: {}, atualizadoEm: 0 };
const S = {
  cfg: LS.get('cfg', { url: '', token: '' }),
  cache: Object.assign({}, CACHE_VAZIO, LS.get('cache', {})),
  fila: LS.get('fila', []),
  sessao: LS.get('sessao', null),
  sync: { ocupado: false, erro: null, espera: 0, timer: null, emEnvio: new Set(), ultimo: LS.get('ultimoSync', 0) },
  ui: { modal: null, verArquivados: false, planoDraft: null },
};
const salvar = {
  cfg: () => LS.set('cfg', S.cfg),
  cache: () => LS.set('cache', S.cache),
  fila: () => LS.set('fila', S.fila),
  sessao: () => LS.set('sessao', S.sessao),
};
const cfgVal = k => { const v = num(S.cache.config && S.cache.config[k]); return v == null ? DEF[k] : v; };

// ---------------------------------------------------------------- dados do cache
const exPorId = id => S.cache.exercicios.find(e => e.exercicio_id === id);
const nomeEx = id => (exPorId(id) || {}).nome || '(exercício removido)';
const exAtivos = () => S.cache.exercicios.filter(e => bool(e.ativo, true)).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
const planosOrd = () => S.cache.planos.slice().sort((a, b) => (num(a.ordem) ?? 1e9) - (num(b.ordem) ?? 1e9));
const itensDoPlano = id => S.cache.itens.filter(i => i.plano_id === id).sort((a, b) => (num(a.ordem) || 0) - (num(b.ordem) || 0));
function upsertLocal(lista, chave, obj) {
  const arr = S.cache[lista];
  const i = arr.findIndex(x => x[chave] === obj[chave]);
  if (i >= 0) arr[i] = { ...arr[i], ...obj }; else arr.push(obj);
}

// ---------------------------------------------------------------- fila e sincronização (RT-06..08, RT-11)
function enfileirarOp(op, aba, id, dados) {
  enfileirar(S.fila, { qid: uuid(), op, aba, id, dados: dados || {}, ts: Date.now() }, S.sync.emEnvio);
  salvar.fila();
  atualizarBadge();
  clearTimeout(S.sync.timer);
  S.sync.timer = setTimeout(sincronizar, 400);
}

async function api(metodo, corpo, params) {
  if (!S.cfg.url) throw new Error('URL do Web App não configurada');
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    let res;
    if (metodo === 'GET') {
      const u = new URL(S.cfg.url);
      Object.entries(Object.assign({}, params, { token: S.cfg.token })).forEach(([k, v]) => u.searchParams.set(k, v));
      res = await fetch(u, { signal: ctrl.signal, redirect: 'follow' });
    } else {
      // text/plain evita o preflight de CORS, que o Apps Script não atende
      res = await fetch(S.cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.cfg.token }, corpo)),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal, redirect: 'follow' });
    }
    const txt = await res.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('Resposta inválida do Web App (confira a URL e o acesso "Qualquer pessoa")'); }
    if (!j.ok) throw new Error(j.erro || 'Erro no Web App');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Tempo esgotado');
    if (e instanceof TypeError) throw new Error('Sem rede ou Web App inacessível');
    throw e;
  } finally { clearTimeout(t); }
}

async function sincronizar() {
  const sy = S.sync;
  clearTimeout(sy.timer);
  if (sy.ocupado || !S.cfg.url || !S.fila.length) { atualizarBadge(); return; }
  sy.ocupado = true;
  const lote = S.fila.slice(0, 60);
  lote.forEach(x => sy.emEnvio.add(x.qid));
  atualizarBadge();
  try {
    await api('POST', { ops: lote.map(({ op, aba, id, dados }) => ({ op, aba, id, dados })) });
    const enviados = new Set(lote.map(x => x.qid));
    S.fila = S.fila.filter(x => !enviados.has(x.qid));
    salvar.fila();
    sy.erro = null; sy.espera = 0; sy.ultimo = Date.now(); LS.set('ultimoSync', sy.ultimo);
  } catch (e) {
    sy.erro = e.message;
    sy.espera = Math.min(60000, (sy.espera || 2500) * 2);
  } finally {
    sy.ocupado = false;
    sy.emEnvio.clear();
    atualizarBadge();
    if (S.fila.length) sy.timer = setTimeout(sincronizar, sy.erro ? sy.espera : 50);
  }
}

/** Baixa catálogo, planos e histórico. Só substitui o cache se não houver nada pendente. */
async function carregarDados(silencioso) {
  if (!S.cfg.url) return;
  try {
    await sincronizar();
    if (S.fila.length) { if (!silencioso) toast('Há envios pendentes; tente de novo após sincronizar'); return; }
    const r = await api('GET', null, { acao: 'bootstrap' });
    S.cache = Object.assign({}, CACHE_VAZIO, r.dados, { atualizadoEm: Date.now() });
    salvar.cache();
    S.sync.erro = null;
    if (!silencioso) toast('Dados atualizados da planilha');
    const r0 = rota().r;
    if (!S.ui.modal && !['plano', 'exercicio', 'config'].includes(r0)) render();
  } catch (e) {
    S.sync.erro = e.message;
    if (!silencioso) toast('Falha ao carregar: ' + e.message);
  }
  atualizarBadge();
}

function badgeTxt(compacto) {
  const n = S.fila.length;
  if (compacto) return `<span class="dot ${!S.cfg.url || S.sync.erro ? 'err' : n ? 'warn' : ''}"></span>${n || '✓'}`;
  if (!S.cfg.url) return '<span class="dot err"></span>não configurado';
  if (S.sync.ocupado) return `<span class="dot warn"></span>enviando ${n}…`;
  if (!navigator.onLine && n) return `<span class="dot warn"></span>offline · ${n} pendente${n > 1 ? 's' : ''}`;
  if (S.sync.erro) return `<span class="dot err"></span>erro${n ? ' · ' + n + ' pendente' + (n > 1 ? 's' : '') : ''}`;
  if (n) return `<span class="dot warn"></span>${n} pendente${n > 1 ? 's' : ''}`;
  return '<span class="dot"></span>sincronizado';
}
const badgeHtml = compacto => `<button class="badge" id="badge" data-c="${compacto ? 1 : ''}" data-a="ir" data-h="#/config" aria-label="Estado da sincronização">${badgeTxt(compacto)}</button>`;
function atualizarBadge() { const b = $('#badge'); if (b) b.innerHTML = badgeTxt(!!b.dataset.c); }

// ---------------------------------------------------------------- áudio, vibração, flash, wake lock (RT-04, RT-05)
const audio = {
  ctx: null,
  liberar() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) { /* sem áudio */ }
  },
  bipe(freq, dur, vol, atraso = 0) {
    const c = this.ctx;
    if (!c) return;
    const t = c.currentTime + atraso, o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
};
const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* iOS */ } };
function piscar() {
  document.body.classList.remove('flash');
  void document.body.offsetWidth;
  document.body.classList.add('flash');
  setTimeout(() => document.body.classList.remove('flash'), 3000);
}
const alerta = {
  aviso() { audio.bipe(660, 0.12, 0.12); vibrar(80); },
  forte() {
    [0, 0.3, 0.6, 1.2, 1.5, 1.8].forEach(t => audio.bipe(988, 0.2, 0.6, t));
    vibrar([400, 150, 400, 150, 600]);
    piscar();
  },
};
const wake = {
  s: null,
  async ligar() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !this.s) {
        this.s = await navigator.wakeLock.request('screen');
        this.s.addEventListener('release', () => { this.s = null; });
      }
    } catch (e) { /* não suportado ou negado */ }
  },
  async desligar() { try { if (this.s) await this.s.release(); } catch (e) { /* ok */ } this.s = null; },
};

// ---------------------------------------------------------------- sessão
const exAtual = () => { const s = S.sessao; return s && (s.exercicios.find(e => e.key === s.atualKey) || s.exercicios[0]); };
const seriesDoEx = ex => S.sessao.series.filter(x => x.ex_key === ex.key);
const trabalhoDoEx = ex => seriesDoEx(ex).filter(x => !x.aquecimento);
const concluido = ex => trabalhoDoEx(ex).length >= ex.series;

function itemPadrao() {
  return { series: cfgVal('series_padrao'), reps_min: cfgVal('reps_min_padrao'), reps_max: cfgVal('reps_max_padrao'), descanso_s: cfgVal('descanso_padrao_s') };
}

function novoExSessao(exercicio_id, item, extra) {
  const ex = exPorId(exercicio_id) || {};
  const it = {
    series: num(item.series) || cfgVal('series_padrao'),
    reps_min: num(item.reps_min) || cfgVal('reps_min_padrao'),
    reps_max: num(item.reps_max) || cfgVal('reps_max_padrao'),
    descanso_s: num(item.descanso_s) ?? cfgVal('descanso_padrao_s'),
  };
  if (it.reps_max < it.reps_min) it.reps_max = it.reps_min;
  const hist = (S.cache.historico[exercicio_id] || []).filter(h => !S.sessao || h.sessao_id !== S.sessao.sessao_id);
  return {
    key: uuid(), item_id: item.item_id || null, exercicio_id, nome: ex.nome || '(exercício removido)', equipamento: ex.equipamento || '',
    incremento: num(ex.incremento_kg) || 0, ...it, extra: !!extra, pulado: false, ordemExec: null,
    sugestao: sugerir(hist, it, ex), ultima: hist[0] || null,
    recordeAnterior: S.cache.recordes[exercicio_id] || null,
  };
}

function iniciarSessao(planoId) {
  audio.liberar();
  if (S.sessao) { location.hash = '#/sessao'; return; }
  const plano = planoId ? S.cache.planos.find(p => p.plano_id === planoId) : null;
  const itens = plano ? itensDoPlano(planoId) : [];
  const agora = Date.now();
  S.sessao = {
    sessao_id: uuid(), plano_id: plano ? plano.plano_id : '', plano_nome: plano ? plano.nome : 'Sessão livre',
    inicio: agora, fim: null, encerramento: null, estado: 'ativa', autoFinalizou: false,
    exercicios: [], atualKey: null, series: [], descanso: null, ordemExec: 0, rascunho: null,
    pausadoEm: null, pausaTotal: 0, obs: '', desfazer: [],
  };
  S.sessao.exercicios = itens.map(it => novoExSessao(it.exercicio_id, it, false));
  S.sessao.atualKey = S.sessao.exercicios[0] ? S.sessao.exercicios[0].key : null;
  S.sessao.series_planejadas = S.sessao.exercicios.reduce((a, e) => a + e.series, 0);
  enfileirarOp('upsert', 'Sessoes', S.sessao.sessao_id, {
    plano_id: S.sessao.plano_id, plano_nome: S.sessao.plano_nome, inicio: iso(agora), series_planejadas: S.sessao.series_planejadas,
  });
  salvar.sessao();
  wake.ligar();
  location.hash = '#/sessao';
  render();
}

function garantirRascunho(ex) {
  const s = S.sessao;
  if (s.rascunho && s.rascunho.key === ex.key) return s.rascunho;
  const w = trabalhoDoEx(ex);
  const sug = ex.sugestao;
  const reps = sug.reps.length ? sug.reps[Math.min(w.length, sug.reps.length - 1)] : ex.reps_min;
  const peso = w.length ? w[w.length - 1].peso_kg : sug.peso;
  s.rascunho = { key: ex.key, peso, reps, rir: null, aquecimento: false };
  return s.rascunho;
}

function pararDescanso(gravar = true) {
  const s = S.sessao, d = s && s.descanso;
  if (!d) return;
  s.descanso = null;
  if (!gravar) return;
  const real = Math.round((Date.now() - d.inicio) / 1000);
  const serie = s.series.find(x => x.serie_id === d.serie_id);
  if (serie) {
    serie.descanso_real_s = real;
    enfileirarOp('upsert', 'Series', serie.serie_id, { descanso_real_s: real });
  }
}

function proximoPendente(s, deKey) {
  const i0 = s.exercicios.findIndex(e => e.key === deKey);
  const ordem = s.exercicios.slice(i0 + 1).concat(s.exercicios.slice(0, Math.max(0, i0)));
  return ordem.find(e => !e.pulado && !concluido(e));
}

function deveAutoFinalizar(s) {
  const plan = s.exercicios.filter(e => !e.extra && !e.pulado);
  return !!s.plano_id && s.series_planejadas > 0 && !s.autoFinalizou && plan.length > 0 && plan.every(concluido);
}

// ---- pausa
function retomarPausa() {
  const s = S.sessao;
  if (!s || !s.pausadoEm) return;
  const d = Date.now() - s.pausadoEm;
  s.pausaTotal = (s.pausaTotal || 0) + d;
  if (s.descanso) s.descanso.inicio += d; // o descanso também fica congelado durante a pausa
  s.pausadoEm = null;
}

// ---- desfazer: cada ação guarda uma foto da sessão; desfazer restaura a foto e reverte a planilha
const MAX_DESFAZER = 20;
function fotografar(rotulo, comPlano) {
  const s = S.sessao;
  const { desfazer, ...resto } = s;
  const foto = { rotulo, estado: JSON.stringify(resto) };
  if (comPlano && s.plano_id) foto.itensPlano = JSON.stringify(itensDoPlano(s.plano_id));
  s.desfazer = (desfazer || []).concat([foto]).slice(-MAX_DESFAZER);
}

function desfazer() {
  const s = S.sessao, pilha = (s && s.desfazer) || [];
  if (!pilha.length) return;
  const { rotulo, estado, itensPlano } = pilha[pilha.length - 1];
  const ant = JSON.parse(estado);
  opsParaReverter(s.series, ant.series, COLS.Series).forEach(o => enfileirarOp(o.op, 'Series', o.id, o.dados));
  if (itensPlano) {
    const alvo = JSON.parse(itensPlano);
    opsParaReverter(itensDoPlano(s.plano_id), alvo, COLS.PlanoItens, 'item_id').forEach(o => enfileirarOp(o.op, 'PlanoItens', o.id, o.dados));
    S.cache.itens = S.cache.itens.filter(i => i.plano_id !== s.plano_id).concat(alvo);
    salvar.cache();
  }
  // Pausa e observação não fazem parte do desfazer: durante o treino, mantém o estado atual delas
  if (ant.estado === 'ativa') {
    if (ant.descanso) ant.descanso.inicio += (s.pausaTotal || 0) - (ant.pausaTotal || 0);
    Object.assign(ant, { pausadoEm: s.pausadoEm, pausaTotal: s.pausaTotal || 0 });
  }
  Object.assign(ant, { obs: s.obs || '', desfazer: pilha.slice(0, -1) });
  S.sessao = ant;
  salvar.sessao();
  if (ant.estado === 'ativa' && !ant.pausadoEm) wake.ligar();
  S.ui.modal = null;
  render();
  toast('Desfeito: ' + rotulo);
}

// ---- inserir / alterar / excluir exercício durante o treino
const prefAplicarPlano = () => LS.get('aplicarNoPlano', true);
const recalcPlanejadas = s => { s.series_planejadas = s.exercicios.filter(e => !e.extra).reduce((a, e) => a + e.series, 0); };

function gravarItemPlano(it) {
  upsertLocal('itens', 'item_id', it);
  enfileirarOp('upsert', 'PlanoItens', it.item_id, pick(it, COLS.PlanoItens));
}

/** Insere no plano o item do exercício `ex`, logo depois do item do exercício anterior da sessão que está no plano. */
function inserirNoPlano(s, ex) {
  const itens = itensDoPlano(s.plano_id);
  const i = s.exercicios.indexOf(ex);
  const anterior = s.exercicios.slice(0, i).reverse().find(e => e.item_id && itens.some(it => it.item_id === e.item_id));
  const pos = anterior ? itens.findIndex(it => it.item_id === anterior.item_id) + 1 : 0;
  ex.item_id = uuid();
  itens.splice(pos, 0, { item_id: ex.item_id, plano_id: s.plano_id, exercicio_id: ex.exercicio_id, series: ex.series,
    reps_min: ex.reps_min, reps_max: ex.reps_max, descanso_s: ex.descanso_s, obs: '' });
  itens.forEach((it, k) => { if (it.item_id === ex.item_id || num(it.ordem) !== k + 1) gravarItemPlano({ ...it, ordem: k + 1 }); });
  salvar.cache();
}

function rascunhoExValido(d) {
  const v = { series: Math.round(num(d.series) || 0), reps_min: Math.round(num(d.reps_min) || 0),
    reps_max: Math.round(num(d.reps_max) || 0), descanso_s: Math.round(num(d.descanso_s) ?? -1) };
  if (v.series < 1 || v.reps_min < 1 || v.descanso_s < 0) { toast('Séries, repetições e descanso inválidos'); return null; }
  if (v.reps_max < v.reps_min) { toast('Reps máx menor que reps mín'); return null; }
  return v;
}

/** Cria uma série no exercício `ex` da sessão e a envia. Usado no registro e no resumo. */
function criarSerie(ex, v) {
  const s = S.sessao;
  if (ex.ordemExec == null) ex.ordemExec = ++s.ordemExec;
  const w = trabalhoDoEx(ex).length;
  const serie = {
    serie_id: uuid(), sessao_id: s.sessao_id, exercicio_id: ex.exercicio_id, ex_key: ex.key,
    ordem_exercicio: ex.ordemExec, n_serie: Math.max(0, ...seriesDoEx(ex).map(x => x.n_serie)) + 1, aquecimento: !!v.aquecimento,
    peso_kg: v.peso, reps: v.reps, rir: v.rir,
    sugerido_peso_kg: v.aquecimento ? null : ex.sugestao.peso,
    sugerido_reps: v.aquecimento ? null : ex.sugestao.reps[Math.min(w, ex.sugestao.reps.length - 1)],
    descanso_real_s: null, registrado_em: iso(Date.now()),
  };
  s.series.push(serie);
  enfileirarOp('upsert', 'Series', serie.serie_id, pick(serie, COLS.Series));
  return serie;
}

function finalizar(encerramento) {
  const s = S.sessao;
  retomarPausa();
  s.fim = Date.now();
  s.encerramento = encerramento;
  s.estado = 'resumo';
  if (encerramento === 'auto') s.autoFinalizou = true;
  salvar.sessao();
  render();
}

function registrarSerie() {
  const s = S.sessao, ex = exAtual();
  if (!s || !ex || s.pausadoEm) return;
  const r = garantirRascunho(ex);
  const peso = num(r.peso), reps = Math.round(num(r.reps) || 0);
  if (peso == null || peso < 0) { toast('Informe o peso'); $('#in-peso') && $('#in-peso').focus(); return; }
  if (reps < 1) { toast('Informe as repetições'); return; }
  audio.liberar();
  fotografar(r.aquecimento ? `Aquecimento — ${ex.nome}` : `Série ${trabalhoDoEx(ex).length + 1} — ${ex.nome}`);
  pararDescanso();
  const agora = Date.now();
  const serie = criarSerie(ex, { peso, reps, rir: r.rir, aquecimento: r.aquecimento });
  vibrar(25);
  s.rascunho = null;

  if (!serie.aquecimento && deveAutoFinalizar(s)) { finalizar('auto'); return; }

  s.descanso = { inicio: agora, dur: ex.descanso_s, ajuste: 0, serie_id: serie.serie_id, avisado: false, alertado: false };
  if (!serie.aquecimento && trabalhoDoEx(ex).length === ex.series) {
    const prox = proximoPendente(s, ex.key);
    if (prox) s.atualKey = prox.key;
  }
  salvar.sessao();
  render();
}

function calcResumo(s) {
  const work = s.series.filter(x => !x.aquecimento);
  const porKey = Object.fromEntries(s.exercicios.map(e => [e.key, e]));
  let volume = 0;
  work.forEach(x => { volume += volumeSerie(x, (porKey[x.ex_key] || {}).equipamento); });
  const prs = [], porEx = [];
  s.exercicios.forEach(ex => {
    const w = work.filter(x => x.ex_key === ex.key);
    porEx.push({ ex, w, todas: s.series.filter(x => x.ex_key === ex.key) });
    if (!w.length) return;
    const ant = ex.recordeAnterior;
    const melhor = w.reduce((a, x) => e1rm(x.peso_kg, x.reps) > e1rm(a.peso_kg, a.reps) ? x : a);
    const maior = w.reduce((a, x) => x.peso_kg > a.peso_kg || (x.peso_kg === a.peso_kg && x.reps > a.reps) ? x : a);
    if (ant && ant.e1rm && melhor.peso_kg > 0 && e1rm(melhor.peso_kg, melhor.reps) > ant.e1rm.valor + 0.01) {
      prs.push(`${ex.nome}: 1RM estimado ${fmtKg(arred(e1rm(melhor.peso_kg, melhor.reps)))} kg (${fmtKg(melhor.peso_kg)} × ${melhor.reps})`);
    }
    if (ant && ant.peso && maior.peso_kg > ant.peso.valor) {
      prs.push(`${ex.nome}: maior carga ${fmtKg(maior.peso_kg)} kg × ${maior.reps}`);
    }
  });
  return {
    duracao: Math.round(tempoAtivo(s, Date.now()) / 1000), pausa: Math.round((s.pausaTotal || 0) / 1000),
    feitas: work.length, planejadas: s.series_planejadas || 0, volume: arred(volume), prs, porEx,
  };
}

function atualizarCacheComSessao(s) {
  const nHist = cfgVal('historico_sessoes');
  const data = iso(s.inicio);
  const porEx = {};
  s.series.forEach(x => { (porEx[x.exercicio_id] = porEx[x.exercicio_id] || []).push(x); });
  Object.entries(porEx).forEach(([exid, series]) => {
    const entrada = {
      sessao_id: s.sessao_id, data,
      series: series.map(x => ({ n_serie: x.n_serie, aquecimento: x.aquecimento, peso_kg: x.peso_kg, reps: x.reps, rir: x.rir }))
        .sort((a, b) => a.n_serie - b.n_serie),
    };
    const h = (S.cache.historico[exid] || []).filter(e => e.sessao_id !== s.sessao_id);
    S.cache.historico[exid] = [entrada].concat(h).slice(0, nHist);
    S.cache.recordes[exid] = atualizarRecorde(S.cache.recordes[exid], series, data);
  });
  salvar.cache();
}

function concluirSessao() {
  const s = S.sessao;
  pararDescanso(false);
  const r = calcResumo(s);
  enfileirarOp('upsert', 'Sessoes', s.sessao_id, {
    fim: iso(s.fim || Date.now()), duracao_s: r.duracao, pausa_s: r.pausa, encerramento: s.encerramento || 'manual',
    series_feitas: r.feitas, series_planejadas: s.series_planejadas || 0, volume_kg: r.volume, obs: (s.obs || '').trim(),
  });
  atualizarCacheComSessao(s);
  S.sessao = null;
  salvar.sessao();
  wake.desligar();
  location.hash = '#/';
  render();
  toast('Treino salvo');
  sincronizar().then(() => carregarDados(true));
}

// ---------------------------------------------------------------- relógios (RT-03: sempre por diferença de timestamps)
function tick() {
  const s = S.sessao;
  if (!s) return;
  const agora = Date.now();
  const rel = $('#relogio');
  if (rel) rel.textContent = fmtDur(tempoAtivo(s, agora) / 1000);
  const pt = $('#pausa-tempo');
  if (pt && s.pausadoEm) pt.textContent = fmtDur((agora - s.pausadoEm) / 1000);
  const d = s.descanso;
  if (!d || s.estado !== 'ativa' || s.pausadoEm) return;
  const total = Math.max(0, d.dur + d.ajuste) * 1000;
  const resta = d.inicio + total - agora;
  const aviso = cfgVal('aviso_antecipado_s') * 1000;
  const box = $('#descanso');
  if (box) {
    $('#desc-tempo').textContent = resta > 0 ? fmtDur(Math.ceil(resta / 1000)) : '+' + fmtDur(Math.floor(-resta / 1000));
    $('#desc-bar').style.width = (total ? Math.min(100, (agora - d.inicio) / total * 100) : 100) + '%';
    box.classList.toggle('aviso', resta > 0 && resta <= aviso);
    box.classList.toggle('extra', resta <= 0);
  }
  if (resta > 0 && resta <= aviso && !d.avisado) { d.avisado = true; salvar.sessao(); alerta.aviso(); }
  if (resta <= 0 && !d.alertado) {
    d.alertado = true; d.avisado = true; salvar.sessao();
    if (-resta < 5000) alerta.forte(); // ao reabrir muito depois, não dispara alarme velho
  }
}

// ---------------------------------------------------------------- rotas e telas
function rota() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, p] = h.split('/');
  return { r: r || 'inicio', p: p ? decodeURIComponent(p) : '' };
}

function topo(titulo, extra = '') {
  return `<div class="top"><h1>${esc(titulo)}</h1>${extra}${badgeHtml()}</div>`;
}

function nav(atual) {
  const itens = [['inicio', '#/', '🏋️', 'Treinar'], ['historico', '#/historico', '📈', 'Histórico'], ['planos', '#/planos', '📋', 'Planos'],
    ['exercicios', '#/exercicios', '📚', 'Exercícios'], ['config', '#/config', '⚙️', 'Config']];
  return `<div class="bottom"><div><nav class="nav">${itens.map(([k, h, i, t]) =>
    `<a href="${h}" class="${k === atual ? 'on' : ''}"><span>${i}</span>${t}</a>`).join('')}</nav></div></div>`;
}

function render() {
  const { r, p } = rota();
  let h;
  if (r === 'sessao' && S.sessao) h = telaSessao();
  else if (r === 'planos') h = telaPlanos();
  else if (r === 'plano') h = telaPlanoEditor(p);
  else if (r === 'exercicios') h = telaExercicios();
  else if (r === 'exercicio') h = telaExercicioEditor(p);
  else if (r === 'historico') h = p ? telaHistoricoEx(p) : telaHistorico();
  else if (r === 'config') h = telaConfig();
  else h = telaInicio();
  $('#app').innerHTML = h + modalHtml();
  tick();
}

function seriesTxt(series) {
  const w = (series || []).filter(x => !bool(x.aquecimento));
  if (!w.length) return '—';
  const pesos = [...new Set(w.map(x => num(x.peso_kg)))];
  if (pesos.length === 1) return `${fmtKg(pesos[0])} kg × ${w.map(x => x.reps).join(', ')}`;
  return w.map(x => `${fmtKg(x.peso_kg)}×${x.reps}`).join(' · ');
}

// ---- início
function telaInicio() {
  let h = topo('Treino');
  if (!S.cfg.url) {
    h += `<div class="card"><b>Conecte sua planilha</b><p class="muted small">Informe a URL do Web App e o token para sincronizar. Sem isso o app funciona só no aparelho.</p>
      <button class="pri w100" data-a="ir" data-h="#/config">Configurar</button></div>`;
  }
  if (S.sessao) {
    const s = S.sessao;
    h += `<div class="card"><div class="muted small">Treino em andamento</div><b>${esc(s.plano_nome)}</b>
      <div class="muted small">desde ${new Date(s.inicio).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · ${s.series.length} séries${s.pausadoEm ? ' · <span class="tag warn">pausado</span>' : ''}</div>
      <button class="pri big mt" data-a="ir" data-h="#/sessao">Retomar treino</button></div>`;
    return h + nav('inicio');
  }
  const planos = planosOrd().filter(p => bool(p.ativo, true));
  h += '<h2>Iniciar treino</h2>';
  if (!planos.length) h += `<p class="muted">Nenhum plano ainda. Crie em <a href="#/planos">Planos</a> ou direto na planilha.</p>`;
  planos.forEach(p => {
    const its = itensDoPlano(p.plano_id);
    const nomes = its.map(i => nomeEx(i.exercicio_id)).join(' · ');
    h += `<div class="card"><b>${esc(p.nome)}</b>
      <div class="muted small">${its.length} exercícios · ${its.reduce((a, i) => a + (num(i.series) || 0), 0)} séries</div>
      <div class="muted small clamp">${esc(nomes)}</div>
      <button class="pri big mt" data-a="iniciar" data-id="${esc(p.plano_id)}" ${its.length ? '' : 'disabled'}>Iniciar treino</button></div>`;
  });
  h += `<button class="big mt" data-a="iniciar" data-id="">Sessão livre</button>`;
  return h + nav('inicio');
}

// ---- sessão (RP-07..RP-22)
function botaoDesfazer() {
  const p = S.sessao.desfazer || [], rot = p.length ? 'Desfazer: ' + p[p.length - 1].rotulo : 'Nada para desfazer';
  return `<button data-a="desfazer" ${p.length ? '' : 'disabled'} aria-label="${esc(rot)}" title="${esc(rot)}">↶</button>`;
}

function barraSessao() {
  const s = S.sessao;
  return `<div class="top"><div class="grow"><div class="muted small clamp">${esc(s.plano_nome)}</div><div class="relogio" id="relogio">0:00</div></div>
    ${badgeHtml(true)}${botaoDesfazer()}
    <button data-a="${s.pausadoEm ? 'retomar' : 'pausar'}" aria-label="${s.pausadoEm ? 'Retomar treino' : 'Pausar treino'}">${s.pausadoEm ? '▶' : '❚❚'}</button>
    <button data-a="modal" data-t="menu" aria-label="Menu">⋮</button></div>`;
}

/** Linha de uma série, tocável para editar. */
function serieLi(x, doEx) {
  const n = doEx.filter(y => !y.aquecimento && y.n_serie <= x.n_serie).length;
  return `<button class="li" data-a="modal" data-t="serie" data-id="${x.serie_id}">
    <span class="tag ${x.aquecimento ? '' : 'ac'}">${x.aquecimento ? 'aq' : '#' + n}</span>
    <span class="grow"><b>${fmtKg(x.peso_kg)} kg × ${x.reps}</b>${x.rir != null ? ` <span class="muted small">RIR ${x.rir}</span>` : ''}</span>
    <span class="muted small">${x.descanso_real_s != null ? '⏱ ' + fmtDur(x.descanso_real_s) : ''} ✎</span></button>`;
}

function telaSessao() {
  const s = S.sessao;
  if (s.estado === 'resumo') return telaResumo();
  const ex = exAtual();
  let h = barraSessao();
  if (s.pausadoEm) {
    return h + `<div class="card center"><div class="muted">Treino pausado há</div><div class="timer-big" id="pausa-tempo">0:00</div>
      <div class="muted small">A pausa não conta na duração do treino${s.descanso ? ' e o descanso em andamento também fica parado' : ''}.</div></div>
      ${ex ? `<p class="muted small center">Ao voltar: ${esc(ex.nome)}, série ${trabalhoDoEx(ex).length + 1} de ${ex.series}</p>` : ''}
      <div class="bottom"><div><button class="okb big" data-a="retomar">▶ Retomar treino</button></div></div>`;
  }
  if (!ex) {
    return h + `<div class="card center"><p>Nenhum exercício na sessão.</p>
      <button class="pri big" data-a="modal" data-t="picker" data-dest="sessao">+ Adicionar exercício</button></div>`;
  }
  const r = garantirRascunho(ex);
  const w = trabalhoDoEx(ex).length;
  const pos = s.exercicios.indexOf(ex) + 1;
  const sug = ex.sugestao;
  const iAlvo = Math.min(w, sug.reps.length - 1);
  const alvo = sug.reps.map((x, i) => i === iAlvo && w < ex.series ? `<span class="cur">${x}</span>` : x).join(', ');
  const tipoPeso = ex.equipamento === 'halter' ? ' · um halter' : ex.equipamento === 'peso_corporal' ? ' · carga adicional' : '';

  h += `<div class="card">
    <div class="row"><button class="exnome grow" data-a="modal" data-t="exs"><span class="grow clamp">${esc(ex.nome)}</span><span class="muted small">${pos}/${s.exercicios.length} ▾</span></button>
      <button data-a="modal" data-t="exEdit" data-k="${ex.key}" aria-label="Editar exercício">✎</button></div>
    <div class="serieinfo">${w >= ex.series ? `<span class="tag warn">extra</span> Série ${w + 1} (plano: ${ex.series})` : `Série <b>${w + 1}</b> de ${ex.series}`}
      <span class="muted small">· faixa ${ex.reps_min}–${ex.reps_max}${ex.pulado ? ' · <span class="tag">pulado</span>' : ''}</span></div>
    <div class="alvo">Sugestão: <b>${fmtKg(sug.peso)} kg</b> × ${alvo}</div>
    <div class="muted small">${esc(sug.motivo)}</div>
    <div class="muted small mt">Última vez: ${ex.ultima ? `${fmtData(ex.ultima.data)} · ${esc(seriesTxt(ex.ultima.series))}` : 'primeira vez'}</div>
  </div>`;

  if (s.descanso) {
    h += `<div class="card descanso" id="descanso"><div class="muted small">Descanso · ${fmtDur(s.descanso.dur + s.descanso.ajuste)}</div>
      <div class="timer-big" id="desc-tempo">0:00</div><div class="bar"><i id="desc-bar"></i></div>
      <div class="row"><button data-a="ajuste" data-d="-15">−15 s</button><button class="pri grow" data-a="proxima">Iniciar próxima série</button><button data-a="ajuste" data-d="15">+15 s</button></div></div>`;
  }

  h += `<div class="card">
    <label class="f">Peso (kg)${tipoPeso}</label>
    <div class="stepper"><button data-a="step" data-c="peso" data-d="-1" aria-label="Menos peso">−</button>
      <input id="in-peso" inputmode="decimal" autocomplete="off" value="${r.peso == null ? '' : fmtKg(r.peso)}" placeholder="—">
      <button data-a="step" data-c="peso" data-d="1" aria-label="Mais peso">+</button></div>
    <label class="f">Repetições</label>
    <div class="stepper"><button data-a="step" data-c="reps" data-d="-1" aria-label="Menos repetições">−</button>
      <input id="in-reps" inputmode="numeric" autocomplete="off" value="${r.reps ?? ''}">
      <button data-a="step" data-c="reps" data-d="1" aria-label="Mais repetições">+</button></div>
    <label class="f">Repetições em reserva (opcional)</label>
    <div class="chips">${[null, 0, 1, 2, 3, 4].map(v => `<button class="chip ${r.rir === v ? 'on' : ''}" data-a="rir" data-v="${v ?? ''}">${v == null ? '—' : v === 4 ? '4+' : v}</button>`).join('')}
      <button class="chip ${r.aquecimento ? 'on' : ''}" data-a="aquec" style="margin-left:auto">Aquecimento</button></div>
  </div>`;

  const ss = seriesDoEx(ex);
  if (ss.length) {
    h += `<div class="card"><div class="muted small">Séries registradas — toque para editar</div>${ss.map(x => serieLi(x, ss)).join('')}</div>`;
  }
  const prox = proximoPendente(s, ex.key);
  if (prox) h += `<p class="muted small center">Próximo: ${esc(prox.nome)}</p>`;

  const rotulo = r.aquecimento ? 'Registrar aquecimento' : w >= ex.series ? 'Registrar série extra' : `Registrar série ${w + 1}`;
  h += `<div class="bottom"><div><button class="okb big" data-a="registrar">${rotulo}</button></div></div>`;
  return h;
}

// ---- resumo (RP-10, RP-12)
function telaResumo() {
  const s = S.sessao, r = calcResumo(s);
  let h = `<div class="top"><h1>Resumo do treino</h1>${badgeHtml(true)}${botaoDesfazer()}</div>`;
  h += `<div class="card"><b>${esc(s.plano_nome)}</b> <span class="tag ${s.encerramento === 'auto' ? 'ok' : 'warn'}">${s.encerramento === 'auto' ? 'concluído' : 'encerrado manualmente'}</span>
    <div class="stats mt">
      <div class="stat"><span class="muted small">Duração</span><b id="relogio">${fmtDur(r.duracao)}</b>${r.pausa ? `<span class="muted small">+ ${fmtDur(r.pausa)} de pausa</span>` : ''}</div>
      <div class="stat"><span class="muted small">Séries</span><b>${r.feitas}${r.planejadas ? ' / ' + r.planejadas : ''}</b></div>
      <div class="stat"><span class="muted small">Volume</span><b>${fmtKg(Math.round(r.volume))} kg</b></div>
      <div class="stat"><span class="muted small">Recordes</span><b>${r.prs.length}</b></div>
    </div></div>`;
  if (r.prs.length) h += `<div class="card"><b class="pr">🏆 Recordes pessoais</b>${r.prs.map(p => `<div class="mt">${esc(p)}</div>`).join('')}</div>`;
  h += '<h2>Revise antes de salvar</h2><p class="muted small">Toque numa série para corrigir ou excluir.</p>';
  h += r.porEx.map(({ ex, w, todas }) => `<div class="card">
    <div class="row"><b class="grow clamp">${esc(ex.nome)}</b><span class="muted small">${w.length}/${ex.series}${ex.pulado ? ' · pulado' : ''}</span></div>
    ${todas.map(x => serieLi(x, todas)).join('') || '<div class="muted small mt">Nenhuma série.</div>'}
    <button class="w100 mt" data-a="modal" data-t="novaSerie" data-k="${ex.key}">+ Série</button></div>`).join('')
    || '<p class="muted">Nenhum exercício na sessão.</p>';
  h += `<label class="f">Observação (opcional)</label><textarea id="res-obs" rows="3" style="padding:10px 12px" placeholder="Como foi o treino?">${esc(s.obs || '')}</textarea>`;
  h += `<div class="bottom"><div class="row"><button class="big grow" style="font-size:17px" data-a="continuar">Continuar treinando</button><button class="okb big grow" data-a="concluir">Concluir</button></div></div>`;
  return h;
}

// ---- planos (RP-04..RP-06)
function telaPlanos() {
  S.ui.planoDraft = null; // sair do editor descarta edições não salvas
  const todos = planosOrd();
  const ativos = todos.filter(p => bool(p.ativo, true)), arq = todos.filter(p => !bool(p.ativo, true));
  const linha = (p, i, n, ativo) => `<div class="card"><div class="row">
      <a class="grow" href="#/plano/${encodeURIComponent(p.plano_id)}" style="color:inherit;text-decoration:none">
        <b>${esc(p.nome)}</b><div class="muted small">${itensDoPlano(p.plano_id).length} exercícios</div></a>
      ${ativo ? `<button data-a="planoMover" data-id="${esc(p.plano_id)}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
      <button data-a="planoMover" data-id="${esc(p.plano_id)}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Descer">↓</button>` : ''}</div>
      <div class="row mt"><button class="grow" data-a="ir" data-h="#/plano/${encodeURIComponent(p.plano_id)}">Editar</button>
      <button class="grow" data-a="planoDuplicar" data-id="${esc(p.plano_id)}">Duplicar</button>
      <button class="grow" data-a="planoArquivar" data-id="${esc(p.plano_id)}">${ativo ? 'Arquivar' : 'Restaurar'}</button></div></div>`;
  let h = topo('Planos');
  h += ativos.map((p, i) => linha(p, i, ativos.length, true)).join('') || '<p class="muted">Nenhum plano ativo.</p>';
  h += `<button class="pri big mt" data-a="novoPlano">+ Novo plano</button>`;
  if (arq.length) {
    h += `<button class="ghost w100 mt muted" data-a="toggleArq">${S.ui.verArquivados ? 'Ocultar' : 'Mostrar'} arquivados (${arq.length})</button>`;
    if (S.ui.verArquivados) h += arq.map(p => linha(p, 0, 0, false)).join('');
  }
  return h + nav('planos');
}

function telaPlanoEditor(id) {
  let d = S.ui.planoDraft;
  if (!d || d.plano.plano_id !== id) {
    const p = S.cache.planos.find(x => x.plano_id === id);
    if (!p) return topo('Plano') + '<p class="muted">Plano não encontrado.</p><a href="#/planos">Voltar</a>' + nav('planos');
    d = S.ui.planoDraft = { plano: { ...p }, itens: itensDoPlano(id).map(i => ({ ...i })), originais: itensDoPlano(id).map(i => i.item_id), novo: false };
  }
  let h = `<div class="top"><button class="ghost" data-a="ir" data-h="#/planos" aria-label="Voltar">←</button><h1>${d.novo ? 'Novo plano' : 'Editar plano'}</h1>${badgeHtml()}</div>`;
  h += `<label class="f">Nome</label><input id="f-plano-nome" value="${esc(d.plano.nome)}" placeholder="Treino A – Peito e Tríceps">`;
  h += '<h2>Exercícios</h2>';
  h += d.itens.map((it, i) => `<div class="card"><div class="row"><b class="grow clamp">${i + 1}. ${esc(nomeEx(it.exercicio_id))}</b>
      <button data-a="piMover" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
      <button data-a="piMover" data-i="${i}" data-d="1" ${i === d.itens.length - 1 ? 'disabled' : ''} aria-label="Descer">↓</button>
      <button class="danger" data-a="piRemover" data-i="${i}" aria-label="Remover">✕</button></div>
      <div class="grid4 mt">
        <label>Séries<input data-pi="${i}" data-campo="series" inputmode="numeric" value="${esc(it.series)}"></label>
        <label>Reps mín<input data-pi="${i}" data-campo="reps_min" inputmode="numeric" value="${esc(it.reps_min)}"></label>
        <label>Reps máx<input data-pi="${i}" data-campo="reps_max" inputmode="numeric" value="${esc(it.reps_max)}"></label>
        <label>Descanso s<input data-pi="${i}" data-campo="descanso_s" inputmode="numeric" value="${esc(it.descanso_s)}"></label>
      </div></div>`).join('') || '<p class="muted">Nenhum exercício.</p>';
  h += `<button class="big mt" data-a="modal" data-t="picker" data-dest="plano">+ Adicionar exercício</button>`;
  h += `<p class="muted small">Editar o plano não altera sessões já registradas.</p>`;
  h += `<div class="bottom"><div class="row"><button class="big grow" data-a="ir" data-h="#/planos">Cancelar</button><button class="okb big grow" data-a="salvarPlano">Salvar</button></div></div>`;
  return h;
}

// ---- exercícios (RP-01..RP-03)
function telaExercicios() {
  const lista = S.cache.exercicios.filter(e => S.ui.verArquivados || bool(e.ativo, true))
    .sort((a, b) => String(a.grupo_muscular).localeCompare(String(b.grupo_muscular), 'pt-BR') || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  let h = topo('Exercícios');
  h += `<input id="busca" placeholder="Buscar exercício" autocomplete="off">`;
  let grupo = null;
  h += '<div class="card">';
  lista.forEach(e => {
    if (e.grupo_muscular !== grupo) { grupo = e.grupo_muscular; h += `<div class="muted small mt" data-grupo>${esc(grupo || 'Sem grupo')}</div>`; }
    h += `<a class="li" href="#/exercicio/${encodeURIComponent(e.exercicio_id)}" data-busca="${esc((e.nome + ' ' + e.grupo_muscular).toLowerCase())}" style="color:inherit;text-decoration:none">
      <span class="grow"><b>${esc(e.nome)}</b><div class="muted small">${esc(EQUIP[e.equipamento] || e.equipamento || '')} · +${fmtKg(num(e.incremento_kg))} kg</div></span>
      ${bool(e.ativo, true) ? '' : '<span class="tag">inativo</span>'}</a>`;
  });
  if (!lista.length) h += '<p class="muted">Catálogo vazio.</p>';
  h += '</div>';
  h += `<button class="pri big mt" data-a="ir" data-h="#/exercicio/novo">+ Novo exercício</button>`;
  h += `<button class="ghost w100 mt muted" data-a="toggleArq">${S.ui.verArquivados ? 'Ocultar' : 'Mostrar'} inativos</button>`;
  return h + nav('exercicios');
}

function telaExercicioEditor(id) {
  const novo = id === 'novo';
  const e = novo ? { exercicio_id: '', nome: '', grupo_muscular: '', equipamento: 'barra', incremento_kg: 2.5, carga_inicial_kg: '', ativo: true } : exPorId(id);
  if (!e) return topo('Exercício') + '<p class="muted">Exercício não encontrado.</p>' + nav('exercicios');
  const grupos = [...new Set(S.cache.exercicios.map(x => x.grupo_muscular).filter(Boolean))].sort();
  let h = `<div class="top"><button class="ghost" data-a="voltar" aria-label="Voltar">←</button><h1>${novo ? 'Novo exercício' : 'Editar exercício'}</h1>${badgeHtml()}</div>`;
  h += `<div class="card">
    <label class="f">Nome</label><input id="f-nome" value="${esc(e.nome)}" placeholder="Supino reto com barra">
    <label class="f">Grupo muscular</label><input id="f-grupo" list="grupos" value="${esc(e.grupo_muscular)}" placeholder="Peito">
    <datalist id="grupos">${grupos.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
    <label class="f">Equipamento</label><select id="f-equip" data-novo="${novo ? 1 : ''}">${Object.entries(EQUIP).map(([k, v]) => `<option value="${k}" ${e.equipamento === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <label class="f">Incremento mínimo de carga (kg)</label><input id="f-inc" inputmode="decimal" value="${e.incremento_kg === '' ? '' : fmtKg(num(e.incremento_kg))}">
    <label class="f">Carga inicial (kg, opcional — usada sem histórico)</label><input id="f-carga" inputmode="decimal" value="${num(e.carga_inicial_kg) == null ? '' : fmtKg(num(e.carga_inicial_kg))}">
    <p class="muted small">Halter: peso de um halter. Peso corporal: só a carga adicional (0 = sem carga extra).</p>
    <label class="row mt"><input type="checkbox" id="f-ativo" style="width:24px;min-height:24px" ${bool(e.ativo, true) ? 'checked' : ''}> Ativo</label>
  </div>`;
  if (!novo) h += `<a class="li" href="#/historico/${encodeURIComponent(e.exercicio_id)}">Ver histórico →</a>`;
  h += `<div class="bottom"><div class="row"><button class="big grow" data-a="voltar">Cancelar</button><button class="okb big grow" data-a="salvarExercicio" data-id="${esc(e.exercicio_id)}">Salvar</button></div></div>`;
  return h;
}

// ---- histórico (RP-26)
function telaHistorico() {
  let h = topo('Histórico');
  h += `<input id="busca" placeholder="Buscar exercício" autocomplete="off">`;
  const lista = S.cache.exercicios.map(e => ({ e, hist: S.cache.historico[e.exercicio_id] || [], rec: S.cache.recordes[e.exercicio_id] }))
    .filter(x => x.hist.length)
    .sort((a, b) => String(b.hist[0].data).localeCompare(String(a.hist[0].data)));
  h += '<div class="card">' + (lista.map(({ e, hist, rec }) => `
    <a class="li" href="#/historico/${encodeURIComponent(e.exercicio_id)}" data-busca="${esc(String(e.nome).toLowerCase())}" style="color:inherit;text-decoration:none">
      <span class="grow"><b>${esc(e.nome)}</b><div class="muted small">${fmtData(hist[0].data)} · ${esc(seriesTxt(hist[0].series))}</div></span>
      ${rec && rec.e1rm ? `<span class="tag ac">1RM ${fmtKg(Math.round(rec.e1rm.valor * 10) / 10)}</span>` : ''}</a>`).join('')
    || '<p class="muted">Nenhum treino registrado ainda.</p>') + '</div>';
  if (S.cache.atualizadoEm) h += `<p class="muted small center">Dados da planilha de ${new Date(S.cache.atualizadoEm).toLocaleString('pt-BR')}</p>`;
  return h + nav('historico');
}

function telaHistoricoEx(id) {
  const hist = S.cache.historico[id] || [], rec = S.cache.recordes[id] || {};
  let h = `<div class="top"><button class="ghost" data-a="voltar" aria-label="Voltar">←</button><h1 class="clamp">${esc(nomeEx(id))}</h1>${badgeHtml()}</div>`;
  h += `<div class="stats">
    <div class="stat"><span class="muted small">1RM estimado (recorde)</span><b>${rec.e1rm ? fmtKg(Math.round(rec.e1rm.valor * 10) / 10) + ' kg' : '—'}</b>
      <span class="muted small">${rec.e1rm ? `${fmtKg(rec.e1rm.peso)} × ${rec.e1rm.reps} · ${fmtData(rec.e1rm.data)}` : ''}</span></div>
    <div class="stat"><span class="muted small">Maior carga</span><b>${rec.peso ? fmtKg(rec.peso.valor) + ' kg' : '—'}</b>
      <span class="muted small">${rec.peso ? `× ${rec.peso.reps} · ${fmtData(rec.peso.data)}` : ''}</span></div></div>`;
  h += '<h2>Últimas sessões</h2>';
  h += hist.map(s => {
    const w = s.series.filter(x => !bool(x.aquecimento) && num(x.reps) > 0);
    const melhor = w.length ? w.reduce((a, x) => e1rm(num(x.peso_kg), num(x.reps)) > e1rm(num(a.peso_kg), num(a.reps)) ? x : a) : null;
    return `<div class="card"><div class="row"><b class="grow">${fmtData(s.data)}</b>${melhor ? `<span class="tag ac">1RM ${fmtKg(Math.round(e1rm(num(melhor.peso_kg), num(melhor.reps)) * 10) / 10)}</span>` : ''}</div>
      <div class="mt">${esc(seriesTxt(s.series))}</div>
      ${melhor ? `<div class="muted small">Melhor série: ${fmtKg(melhor.peso_kg)} kg × ${melhor.reps}${s.series.some(x => bool(x.aquecimento)) ? ` · ${s.series.filter(x => bool(x.aquecimento)).length} aquecimento` : ''}</div>` : ''}</div>`;
  }).join('') || '<p class="muted">Sem registros.</p>';
  h += `<p class="muted small">1RM estimado pela fórmula de Epley: peso × (1 + reps/30).</p>`;
  return h + nav('historico');
}
